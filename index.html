<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>My Site</title>
</head>

<body>
    <div class="container">
        <main>
            <section class="cat">
                <div class="card-container">
                    <img src="image.png" alt="Angeline's photo" />
                    <div class="hover-card">
                        <h3>Bio</h3>
                        <p>Hello! I'm Angeline. I like to read and listen to music in my free time. </p>
                    </div>
                </div>
            </section>

            <div id="video"></div>
            <script async src="https://www.youtube.com/iframe_api"></script>
            <script>
                function onYouTubeIframeAPIReady() {
                    var player;
                    player = new YT.Player('video', {
                        videoId: 'AQB6dVt-t64',
                        width: 560,
                        height: 316,
                        playerVars: {
                            autoplay: 1,
                            mute: 1,
                            controls: 1,
                            showinfo: 0,
                            modestbranding: 1,
                            loop: 1,
                            fs: 0,
                            cc_load_policy: 0,
                            iv_load_policy: 3,
                            autohide: 0,
                        },
                    });
                }
            </script>
        </main>
    </div>
</body>

</html>
